name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/catalog-service

jobs:
  # Stage 1 (shift-left): catch secrets, insecure code and vulnerable libraries
  # before anything gets built
  security-checks:
    name: "1. Security checks (secrets, SAST, dependencies)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the secret scan checks every commit

      - name: Secret scan (gitleaks, whole git history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact --verbose

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Static code analysis (bandit)
        run: |
          pip install bandit==1.9.4
          bandit -r app -ll

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

  # Stage 2: unit tests, with a minimum coverage gate
  test:
    name: "2. Unit tests + coverage gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (fail if coverage is below 80%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  # Stage 3: build the image, scan it, publish it
  build:
    name: "3. Build image + Trivy scan + push"
    needs: [security-checks, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: catalog-service:ci
          build-args: APP_VERSION=build-${{ github.run_number }}

      - name: Image vulnerability report (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: catalog-service:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Block the release on critical vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: catalog-service:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Save image for the deploy stage
        run: docker save catalog-service:ci -o image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
          retention-days: 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag catalog-service:ci "$IMAGE:${{ github.sha }}"
          docker tag catalog-service:ci "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Stage 4: deploy to a throwaway Kubernetes cluster and smoke test it
  deploy:
    name: "4. Deploy to Kubernetes (kind) + smoke test"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: image

      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: ci

      - name: Load image into the cluster
        run: |
          docker load -i image.tar
          kind load docker-image catalog-service:ci --name ci

      - name: Deploy (rolling update strategy)
        run: |
          sed 's#catalog-service:v1#catalog-service:ci#' k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/catalog-service --timeout=180s
          kubectl get pods -o wide

      - name: Smoke test
        run: |
          kubectl port-forward svc/catalog-service 8080:80 &
          curl -sf --retry 10 --retry-connrefused --retry-delay 1 localhost:8080/health
          echo
          curl -sf localhost:8080/
          echo
          curl -sf localhost:8080/titles/1
